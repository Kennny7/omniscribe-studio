
<!-- omniscribe-studio/docs/assets/omniscribe-logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="daoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Squircle -->
  <rect width="240" height="240" x="8" y="8" rx="52" fill="url(#obsidianBg)" stroke="url(#cyberCyan)" stroke-width="4" />

  <!-- Outer Cultivation / Arcane Array Circle -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#cyberCyan)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#daoGold)" stroke-width="1" opacity="0.4" />

  <!-- Cybernetic Fountain Nib / Sword Blade -->
  <path d="M128 36 L172 132 L148 196 L108 196 L84 132 Z" fill="url(#daoGold)" filter="url(#glow)" />
  <path d="M128 36 L128 136" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <circle cx="128" cy="136" r="9" fill="#0f172a" stroke="url(#cyberCyan)" stroke-width="3" />

  <!-- Neural Circuit Nodes -->
  <path d="M96 156 L70 176 M160 156 L186 176" stroke="url(#cyberCyan)" stroke-width="3" stroke-linecap="round" />
  <circle cx="66" cy="180" r="5" fill="#06b6d4" />
  <circle cx="190" cy="180" r="5" fill="#a855f7" />
</svg>