# omniscribe-studio/docker-compose.yml
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniscribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daoforge_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-omniscribe_db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daoforge -d omniscribe_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omniscribe-net

  neo4j:
    image: neo4j:5.24-community
    container_name: omniscribe-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/daoforge_graph_2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474" # HTTP Studio
      - "7687:7687" # Bolt Driver
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniscribe-net

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: omniscribe-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - omniscribe-net

  redis:
    image: redis:7.4-alpine
    container_name: omniscribe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - omniscribe-net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: omniscribe-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    ports:
      - "8191:8191"
    networks:
      - omniscribe-net

networks:
  omniscribe-net:
    driver: bridge