# omniscribe-studio/services/agent-swarm/pyproject.toml
[project]
name = "agent-swarm"
version = "1.0.0"
description = "Reinforcement Learning Trait DNA Engine, Dynamic Prompting, and Multi-Agent Literary Council"
requires-python = ">=3.12"
dependencies = [
    "shared-core",
    "pydantic>=2.9.0",
    "litellm>=1.50.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_swarm"]
