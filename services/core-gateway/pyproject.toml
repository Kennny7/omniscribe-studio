# omniscribe-studio/services/core-gateway/pyproject.toml
[project]
name = "core-gateway"
version = "1.0.0"
description = "FastAPI API Gateway, Non-Blocking Agent WebSocket Hub, and Live Progress Streamer"
requires-python = ">=3.12"
dependencies = [
    "shared-core",
    "agent-swarm",
    "ingestion-scraper",
    "translation-pipeline",
    "rag-lore-engine",
    "manuscript-editor",
    "model-trainer",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "websockets>=13.1",
]

[tool.uv.sources]
shared-core = { workspace = true }
agent-swarm = { workspace = true }
ingestion-scraper = { workspace = true }
translation-pipeline = { workspace = true }
rag-lore-engine = { workspace = true }
manuscript-editor = { workspace = true }
model-trainer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_gateway"]
