# omniscribe-studio/services/rag-lore-engine/pyproject.toml
[project]
name = "rag-lore-engine"
version = "1.0.0"
description = "GraphRAG character profile builder, continuity flaw auditor, and plotline predictor"
requires-python = ">=3.12"
dependencies = [
    "shared-core",
    "litellm>=1.50.0",
    "qdrant-client>=1.12.0",
    "neo4j>=5.25.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lore_engine"]
